# Exemple de configuration Nginx pour héberger le site sur votre serveur.
# À placer dans /etc/nginx/sites-available/precisions.group puis :
#   sudo ln -s /etc/nginx/sites-available/precisions.group /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d precisions.group -d www.precisions.group   # certificat HTTPS
#
# Le contenu du dossier dist/ (résultat de `npm run build`) va dans /var/www/precisions.group

server {
    listen 80;
    listen [::]:80;
    server_name precisions.group www.precisions.group;

    root /var/www/precisions.group;
    index index.html;

    # Fichiers générés par Vite : nom unique par version, cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Application monopage : toutes les autres URL (/Contact, /Blog…) servent index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
